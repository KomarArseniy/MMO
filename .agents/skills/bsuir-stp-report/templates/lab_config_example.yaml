# Раздел 2: Цель выполнения лабораторной работы
goal: >
  Изучение принципов построения разветвляющихся алгоритмов, приобретение
  практических навыков составления программ на языке высокого уровня,
  отладка и тестирование разработанного решения на контрольных наборах данных.

# Раздел 3: Теория по лабораторной работе (СТРОГО не более 4 страниц!)
# Можно указать путь к файлу: theory_file: "theory.md" или текст напрямую:
theory: >
  Условный оператор позволяет изменить естественный порядок выполнения инструкций
  программы в зависимости от выполнения определенного условия. В языках
  программирования разветвление реализуется посредством конструкций if-else
  и оператора выбора switch/match.

# Раздел 4: Формулировка индивидуального задания
# Можно указать путь к файлу: task_file: "task.md" или текст напрямую:
task: >
  Для заданного варианта № 7 составить программу вычисления кусочно-заданной функции:
  y = sin(x) при x > 0; y = cos(x) при x <= 0. Выполнить проверку для контрольных точек.

# Раздел 5: Весь код решения индивидуального задания
# Список файлов с кодом или директория с исходниками:
